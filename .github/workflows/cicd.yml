# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [25.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: backup .env
      run: |
        if [ -f .env ]; then mv .env /tmp/env_backup; fi
        if [ -f .env.keys ]; then mv .env.keys /tmp/env_keys_backup; fi
    - uses: actions/checkout@v4
    - name: restore .env
      run: |
        if [ -f /tmp/env_backup ]; then mv /tmp/env_backup .env; fi
        if [ -f /tmp/env_keys_backup ]; then mv /tmp/env_keys_backup .env.keys; fi
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: sudo pm2 restart portfolio

    
